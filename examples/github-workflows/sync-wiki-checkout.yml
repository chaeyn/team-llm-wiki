# Install in the Markdown wiki repository, not the application repository.
# Variables: WIKI_ROOT (absolute checkout), WIKI_RUNNER_LABEL (dedicated runner),
# WIKI_DEFAULT_BRANCH (same as wiki.config.yaml; defaults to repository default).
name: Sync wiki checkout
on: push
permissions:
  contents: read
concurrency:
  group: sync-wiki-checkout
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref_name == (vars.WIKI_DEFAULT_BRANCH || github.event.repository.default_branch)
    runs-on: [self-hosted, '${{ vars.WIKI_RUNNER_LABEL }}']
    steps:
      - name: Fast-forward the server checkout
        shell: bash
        env:
          WIKI_ROOT: ${{ vars.WIKI_ROOT }}
          WIKI_BRANCH: ${{ vars.WIKI_DEFAULT_BRANCH || github.event.repository.default_branch }}
          WIKI_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$WIKI_ROOT"
          test -d "$WIKI_ROOT/.git"
          test -z "$(git -C "$WIKI_ROOT" status --porcelain)"
          test "$(git -C "$WIKI_ROOT" branch --show-current)" = "$WIKI_BRANCH"
          remote=$(git -C "$WIKI_ROOT" remote get-url origin)
          case "$remote" in
            "https://github.com/$WIKI_REPOSITORY"|"https://github.com/$WIKI_REPOSITORY.git"|"git@github.com:$WIKI_REPOSITORY.git") ;;
            *) echo 'Checkout repository does not match the workflow repository' >&2; exit 1 ;;
          esac
          git -C "$WIKI_ROOT" fetch origin "$WIKI_BRANCH"
          git -C "$WIKI_ROOT" merge --ff-only FETCH_HEAD
          git -C "$WIKI_ROOT" rev-parse HEAD
